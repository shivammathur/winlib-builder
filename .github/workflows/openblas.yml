name: Build OpenBLAS
run-name: "Build OpenBLAS ${{ inputs.version }} for PHP ${{ inputs.php }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenBLAS tag to build
        required: true
        default: v0.3.34
      php:
        description: PHP version to build for
        required: true
        default: '8.6'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: ${{ (inputs.php == '8.6' || inputs.php == 'master') && 'windows-2025-vs2026' || 'windows-2022' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Set git to use LF
        run: git config --global core.autocrlf false
      - name: Checkout winlib-builder
        uses: actions/checkout@v6
        with:
          path: winlib-builder
      - name: Checkout OpenBLAS
        uses: actions/checkout@v6
        with:
          repository: OpenMathLib/OpenBLAS
          ref: ${{ inputs.version }}
          path: openblas
      - name: Compute virtual inputs
        id: virtuals
        run: powershell ./winlib-builder/scripts/compute-virtuals.ps1 -version '${{ inputs.php }}' -arch '${{ matrix.arch }}'
      - name: Setup MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          toolset: ${{ steps.virtuals.outputs.toolset }}
      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: make perl
      - name: Install MinGW toolchain
        env:
          RELEASE: ${{ matrix.arch == 'x64' && '9.3.0-7.0.0-r2' || '9.3.0-7.0.0-sjlj-r3' }}
          PACKAGE: ${{ matrix.arch == 'x64' && 'winlibs-mingw-w64-x86_64-9.3.0-7.0.0-r2' || 'winlibs-mingw-w64-i686-9.3.0-7.0.0-r3-sjlj' }}
          SHA256: ${{ matrix.arch == 'x64' && 'd8d5530b03b6c994eedc3228f51ea77f20ae090e7ae911229eabe9cdfc9dc928' || '36eb373d178c2e7499a4650ea5d1608255b8fefba7151e8a5d7c001bd68f1501' }}
        run: |
          Invoke-WebRequest "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:RELEASE/$env:PACKAGE.7z" -OutFile mingw.7z
          if ((Get-FileHash mingw.7z).Hash -ne $env:SHA256) { throw 'MinGW checksum mismatch' }
          7z x mingw.7z -otoolchain -y
          if ($LASTEXITCODE) { throw 'MinGW extraction failed' }
      - name: Build and install OpenBLAS
        shell: msys2 {0}
        working-directory: openblas
        env:
          BINARY: ${{ matrix.arch == 'x64' && '64' || '32' }}
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/toolchain/mingw$BINARY/bin:$PATH"
          # Match the MinGW release options documented in OpenBLAS docs/install.md.
          options=("CC=gcc -static" "FC=gfortran -static"
            "LDFLAGS=-Wl,-Map,$PWD/../install/share/build/OpenBLAS/link.map"
            "BINARY=$BINARY" TARGET=GENERIC DYNAMIC_ARCH=1 DYNAMIC_OLDER=1
            NUM_THREADS=64 CONSISTENT_FPCSR=1 INTERFACE64=0 USE_THREAD=1 USE_OPENMP=0)
          mkdir -p ../install/share/build/OpenBLAS
          for target in libs netlib shared; do
            make -j"$(nproc)" "${options[@]}" "$target"
          done
          make "${options[@]}" "PREFIX=$PWD/../install" install
          cp exports/libopenblas.def ../install/lib/
          cp config_last.h ../install/share/build/OpenBLAS/
          printf '%s\n' "${options[@]}" > ../install/share/build/OpenBLAS/options.txt
          gcc -dumpfullversion > ../install/share/build/OpenBLAS/gcc-version.txt
          gcc -v 2> ../install/share/build/OpenBLAS/compiler.txt
          objdump -t ../install/bin/libopenblas.dll > ../install/share/build/OpenBLAS/symbols.txt
      - name: Copy license files
        shell: msys2 {0}
        run: |
          mkdir -p install/share/licenses/OpenBLAS
          cp openblas/LICENSE install/share/licenses/OpenBLAS/LICENSE.OpenBLAS
          cp openblas/lapack-netlib/LICENSE install/share/licenses/OpenBLAS/LICENSE.OpenBLAS-LAPACK
          mkdir -p install/share/licenses/{gcc-libs,mingw-w64,winpthreads}
          for file in COPYING3 COPYING.LIB COPYING.RUNTIME; do
            curl -fsSL "https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-9.3.0/$file" -o "install/share/licenses/gcc-libs/LICENSE.OpenBLAS-GCC-$file"
          done
          curl -fsSL https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-9.3.0/libbacktrace/backtrace.h -o install/share/licenses/gcc-libs/LICENSE.OpenBLAS-libbacktrace
          curl -fsSL https://raw.githubusercontent.com/mingw-w64/mingw-w64/v7.0.0/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt -o install/share/licenses/mingw-w64/LICENSE.OpenBLAS-MinGW-runtime
          curl -fsSL https://raw.githubusercontent.com/mingw-w64/mingw-w64/v7.0.0/mingw-w64-libraries/winpthreads/COPYING -o install/share/licenses/winpthreads/LICENSE.OpenBLAS-winpthreads
      - name: Prepare MSVC package
        id: package
        run: |
          $version = [regex]::Match((Get-Content openblas/Makefile.rule -Raw), '(?m)^VERSION\s*=\s*(\S+)').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          lib.exe /nologo /machine:${{ matrix.arch }} /def:install/lib/libopenblas.def /out:install/lib/libopenblas.lib
          if ($LASTEXITCODE) { throw 'Import library generation failed' }
          # Adapt only the installed header to MSVC's complex structs.
          $header = 'install/include/lapack.h'
          $types = "#ifdef _MSC_VER`n#include <complex.h>`n#define lapack_complex_float _Fcomplex`n#define lapack_complex_double _Dcomplex`n#endif"
          (Get-Content $header -Raw).Replace('#include <stdlib.h>', "#include <stdlib.h>`n$types") | Set-Content $header
          Remove-Item install/lib/cmake, install/lib/pkgconfig -Recurse
      - name: Resolve embedded SBOM versions
        run: |
          $path = 'winlib-builder/sbom/libraries/openblas.json'
          $metadata = Get-Content $path -Raw | ConvertFrom-Json
          $lapack = Get-Content openblas/lapack-netlib/CMakeLists.txt -Raw
          $versions = @{
            lapack = (@('MAJOR', 'MINOR', 'PATCH') | ForEach-Object {
              [regex]::Match($lapack, "set\(LAPACK_$($_)_VERSION\s+(\d+)\)").Groups[1].Value
            }) -join '.'
            'gcc-runtime' = (Get-Content install/share/build/OpenBLAS/gcc-version.txt).Trim()
            'mingw-w64-runtime' = '7.0.0'
            winpthreads = '7.0.0'
          }
          foreach ($component in $metadata.components) { $component.version.value = $versions[$component.component] }
          $metadata | ConvertTo-Json -Depth 20 | Set-Content $path
      - name: Generate SBOMs
        run: >-
          ./winlib-builder/scripts/generate-sbom.ps1
          -Library OpenBLAS -Version '${{ steps.package.outputs.version }}' -InstallRoot install
          -Vs '${{ steps.virtuals.outputs.vs }}' -Arch '${{ matrix.arch }}'
          -PhpVersion '${{ inputs.php }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenBLAS-${{ steps.package.outputs.version }}-${{ steps.virtuals.outputs.vs }}-${{ matrix.arch }}
          path: install
