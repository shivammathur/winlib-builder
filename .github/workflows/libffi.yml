name: Build libffi
on:
  workflow_dispatch:
    inputs:
      version:
        description: libffi tag to build
        required: true
      php:
        description: PHP version to build for
        required: true
      verify_issue_8:
        description: Build Debug x64 and run libffi issue 8 verifier
        required: false
        default: 'false'
defaults:
  run:
    shell: cmd
jobs:
  build:
    strategy:
      matrix:
          arch: [x64, x86]
    runs-on: windows-2022
    steps:
      - name: Checkout winlib-builder
        uses: actions/checkout@v5
        with:
          path: winlib-builder
      - name: Checkout libffi
        uses: actions/checkout@v5
        with:
          path: libffi
          repository: winlibs/libffi
          ref: ${{github.event.inputs.version}}
      - name: Compute virtual inputs
        id: virtuals
        run: powershell winlib-builder/scripts/compute-virtuals -version ${{github.event.inputs.php}} -arch ${{matrix.arch}}
      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Build libffi
        run: cd libffi\win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}} && msbuild libffi-msvc.sln /p:Configuration=Release;Platform=${{steps.virtuals.outputs.msarch}};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}}
      - name: Build Debug libffi for issue 8
        if: github.event.inputs.verify_issue_8 == 'true' && matrix.arch == 'x64'
        run: cd libffi\win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}} && msbuild libffi-msvc.sln /p:Configuration=Debug;Platform=${{steps.virtuals.outputs.msarch}};PlatformToolset=${{steps.virtuals.outputs.msts}};WindowsTargetPlatformVersion=${{steps.virtuals.outputs.winsdk}}
      - name: Verify issue 8 Release build
        if: github.event.inputs.verify_issue_8 == 'true' && matrix.arch == 'x64'
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set LIBFFI_LIB=libffi\win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\x64\Release
          cl.exe /nologo /W4 /WX /wd4201 /MD /DFFI_STATIC_BUILD /I libffi\include /I libffi\src\x86 /I libffi winlib-builder\scripts\libffi\verify-issue-8.c /Fe:verify-issue-8-release.exe /link /LIBPATH:%LIBFFI_LIB% libffi.lib || exit /b 1
          verify-issue-8-release.exe || exit /b 1
      - name: Verify issue 8 Debug build
        if: github.event.inputs.verify_issue_8 == 'true' && matrix.arch == 'x64'
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set LIBFFI_LIB=libffi\win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\x64\Debug
          cl.exe /nologo /W4 /WX /wd4201 /MDd /DFFI_STATIC_BUILD /I libffi\include /I libffi\src\x86 /I libffi winlib-builder\scripts\libffi\verify-issue-8.c /Fe:verify-issue-8-debug.exe /link /LIBPATH:%LIBFFI_LIB% libffi.lib || exit /b 1
          verify-issue-8-debug.exe || exit /b 1
      - name: Install libffi
        run: |
          cd libffi
          xcopy include\ffi.h ..\install\include\*
          perl -pi -e "s/#define LIBFFI_H/#define LIBFFI_H\n#define FFI_STATIC_BUILD\n#define FFI_BUILDING/" ..\install\include\ffi.h
          xcopy src\x86\ffitarget.h ..\install\include\*
          xcopy fficonfig.h ..\install\include\*
          if "${{matrix.arch}}" == "x64" (
              xcopy win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\x64\Release\libffi.lib ..\install\lib\*
              xcopy win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\x64\Release\libffi.pdb ..\install\lib\*
          ) else (
              xcopy win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\Release\libffi.lib ..\install\lib\*
              xcopy win32\${{steps.virtuals.outputs.vs}}_${{matrix.arch}}\Release\libffi.pdb ..\install\lib\*
          )
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.inputs.version}}-${{steps.virtuals.outputs.vs}}-${{matrix.arch}}
          path: install
